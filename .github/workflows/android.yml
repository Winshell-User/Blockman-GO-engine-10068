name: Android native
on:
  workflow_dispatch:
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  ndk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Get NDK r16b
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q ndk.zip -d $HOME
      - name: ndk-build client
        run: rm -rf dev/client/ApkBuild/obj dev/client/ApkBuild/libs && $HOME/android-ndk-r16b/ndk-build -C dev/client/ApkBuild -j4
      - name: Upload libs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: dev/client/ApkBuild/libs
          if-no-files-found: warn
