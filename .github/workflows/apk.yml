name: Build APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "android.yml run id that produced the .so files"
        required: true
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK pieces
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/download-artifact@v4
        with:
          name: android-so
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: so
      - name: Prepare project
        run: |
          B=dev/client/Shells/Android/Blockmango
          mkdir -p $B/app/libs/armeabi-v7a
          find so -name "*.so" -exec cp {} $B/app/libs/armeabi-v7a/ \;
          ls -l $B/app/libs/armeabi-v7a
          rm -f $B/app/blockmango.keystore
          keytool -genkeypair -keystore $B/app/blockmango.keystore -storepass 111111 -keypass 111111 -alias fbzz -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=local"
          mkdir -p $B/app/src/main/assets/resources/Media
          echo '{"engineVersion":90900}' > $B/app/src/main/assets/resources/Media/engineVersion.json
          cat > $B/build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral(); jcenter() }
              dependencies { classpath 'com.android.tools.build:gradle:3.0.1' }
          }
          allprojects {
              repositories { google(); mavenCentral(); jcenter() }
              ext { engineVersion = 90900 }
          }
          GRADLE
      - name: Gradle build
        shell: bash
        working-directory: dev/client/Shells/Android/Blockmango
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug > ../../../../../gradle.log 2>&1 || (grep -E "error|FAILED|What went wrong|Could not" -A3 ../../../../../gradle.log | head -50; exit 1)
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          if-no-files-found: warn
          path: |
            dev/client/Shells/Android/Blockmango/app/build/outputs/**/*.apk
            gradle.log
